<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#005f85" />
    <title>הנסיעות שלי — Road to Recovery</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/master.js"></script>
    <link rel="stylesheet" href="css/master.css" />
    <link rel="stylesheet" href="css/my-rides.css" />
  </head>
  <body>
    <div class="page page-with-nav">
      <header class="header" id="appHeader"></header>

      <main class="content">
        <section
          class="filter-tabs"
          role="tablist"
          aria-label="סינון נסיעות"
        >
          <button
            class="filter-tab is-active"
            id="tabUpcoming"
            role="tab"
            aria-selected="true"
            data-filter="upcoming"
          >
            <span class="filter-tab__icon" aria-hidden="true">📅</span>
            <span class="filter-tab__label">קרובות</span>
            <span class="filter-tab__count" id="countUpcoming"></span>
          </button>
          <button
            class="filter-tab"
            id="tabPast"
            role="tab"
            aria-selected="false"
            data-filter="past"
          >
            <span class="filter-tab__icon" aria-hidden="true">🕓</span>
            <span class="filter-tab__label">עבר</span>
            <span class="filter-tab__count" id="countPast"></span>
          </button>
          <button
            class="filter-tab"
            id="tabAll"
            role="tab"
            aria-selected="false"
            data-filter="all"
          >
            <span class="filter-tab__icon" aria-hidden="true">📋</span>
            <span class="filter-tab__label">הכל</span>
            <span class="filter-tab__count" id="countAll"></span>
          </button>
        </section>

        <section aria-label="רשימת נסיעות">
          <div class="trip-list" id="tripList"></div>
        </section>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="ניווט ראשי">
      <button class="nav-item" id="navHome">
        <span class="nav-item__icon" aria-hidden="true">🏠</span>
        <span class="nav-item__label">בית</span>
      </button>
      <button class="nav-item" id="navFindRide">
        <span class="nav-item__icon" aria-hidden="true">🔍</span>
        <span class="nav-item__label">חיפוש נסיעה</span>
      </button>
      <button class="nav-item is-active" id="navMyRides" aria-current="page">
        <span class="nav-item__icon" aria-hidden="true">🚗</span>
        <span class="nav-item__label">הנסיעות שלי</span>
      </button>
      <button class="nav-item" id="navSettings">
        <span class="nav-item__icon" aria-hidden="true">⚙️</span>
        <span class="nav-item__label">הגדרות</span>
      </button>
    </nav>

    <!-- Ride details modal -->
    <div class="modal-overlay" id="tripModalOverlay" hidden>
      <div
        class="modal-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="modal-sheet__handle" aria-hidden="true"></div>
        <div class="modal-sheet__header">
          <h2 id="modalTitle">פרטי הסעה</h2>
        </div>

        <div class="modal-info-box">
          <div class="modal-info-box__top">
            <div class="modal-info-box__field">
              <span class="modal-info-box__label">שעה</span>
              <span class="modal-info-box__time" id="modalTime"></span>
            </div>
            <div class="modal-info-box__field modal-info-box__field--date">
              <span class="modal-info-box__label">תאריך</span>
              <span class="modal-info-box__date" id="modalDate"></span>
            </div>
          </div>
          <div class="modal-route">
            <div class="modal-route__point">
              <span class="modal-route__dot modal-route__dot--origin"></span>
              <span>מוצא: <strong id="modalOrigin"></strong></span>
            </div>
            <div class="modal-route__line"></div>
            <div class="modal-route__point">
              <span class="modal-route__dot modal-route__dot--dest"></span>
              <span>יעד: <strong id="modalDest"></strong></span>
            </div>
          </div>
        </div>

        <div class="modal-meta">
          <div class="modal-meta__row">
            <span class="modal-meta__label">נוסע</span>
            <span class="modal-meta__value">
              <span aria-hidden="true">👤</span>
              <span id="modalPatient"></span>
            </span>
          </div>
          <div class="modal-meta__divider"></div>
          <div class="modal-meta__row" id="modalEscortsRow" hidden>
            <span class="modal-meta__label">מלווים</span>
            <span class="modal-meta__value">
              <span aria-hidden="true">🧑‍🤝‍🧑</span>
              <span id="modalEscorts"></span>
            </span>
          </div>
          <div class="modal-meta__divider" id="modalEscortsDivider" hidden></div>
          <div class="modal-meta__row">
            <span class="modal-meta__label">אזור</span>
            <span class="modal-meta__value">
              <span aria-hidden="true">📍</span>
              <span id="modalArea"></span>
            </span>
          </div>
          <div class="modal-meta__divider" id="modalPhoneDivider" hidden></div>
          <div class="modal-meta__row" id="modalPhoneRow" hidden>
            <span class="modal-meta__label">טלפון ליצירת קשר</span>
            <span class="modal-meta__value modal-meta__value--phone">
              <span id="modalPhone"></span>
              <a class="modal-call-btn" id="modalCallBtn" aria-label="התקשרות">📞</a>
            </span>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn-cancel" id="modalCancelBtn">בטל רישום</button>
          <button class="btn-secondary" id="modalCloseBtn">סגור</button>
        </div>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="../js/my-rides.js"></script>
  </body>
</html>
