<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#005f85" />
    <title>חיפוש נסיעה — Road to Recovery</title>
    <link rel="shortcut icon" href="../../assets/images/favicon_1.ico">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/master.js"></script>
    <link rel="stylesheet" href="css/master.css" />
    <link rel="stylesheet" href="css/find-ride.css" />
  </head>
  <body>
    <div class="page page-with-nav">
      <header class="header" id="appHeader"></header>

      <main class="content">
        <section class="ride-search" aria-label="חיפוש וסינון נסיעות">
          <div class="search-box">
            <span class="search-box__icon" aria-hidden="true">🔎</span>
            <input
              type="text"
              id="searchInput"
              class="search-box__input"
              placeholder="חיפוש לפי שם מטופל/ת, מוצא או יעד"
              aria-label="חיפוש לפי שם מטופל/ת, מוצא או יעד" />
            <button
              type="button"
              class="search-box__clear"
              id="searchClearBtn"
              aria-label="ניקוי חיפוש"
              hidden>
              ✕
            </button>
          </div>

          <button
            type="button"
            class="pref-filter-toggle"
            id="prefOnlyToggle"
            aria-pressed="false">
            <span aria-hidden="true">⭐</span>
            <span>הצג רק נסיעות לפי ההעדפות שלי</span>
          </button>

          <div
            class="date-chip-row"
            id="dateChipRow"
            role="group"
            aria-label="סינון לפי תאריך"></div>
        </section>

        <section
          class="filter-tabs"
          role="tablist"
          aria-label="סינון נסיעות">
          <button
            class="filter-tab is-active"
            id="tabAll"
            role="tab"
            aria-selected="true"
            data-filter="all">
            <span class="filter-tab__icon" aria-hidden="true">📋</span>
            <span class="filter-tab__label">הכל</span>
            <span class="filter-tab__count" id="countAll"></span>
          </button>
          <button
            class="filter-tab"
            id="tabMorning"
            role="tab"
            aria-selected="false"
            data-filter="morning">
            <span class="filter-tab__icon" aria-hidden="true">🌅</span>
            <span class="filter-tab__label">בוקר</span>
            <span class="filter-tab__count" id="countMorning"></span>
          </button>
          <button
            class="filter-tab"
            id="tabAfternoon"
            role="tab"
            aria-selected="false"
            data-filter="afternoon">
            <span class="filter-tab__icon" aria-hidden="true">🌇</span>
            <span class="filter-tab__label">אחה"צ</span>
            <span class="filter-tab__count" id="countAfternoon"></span>
          </button>
        </section>

        <section aria-label="רשימת נסיעות פתוחות">
          <div class="trip-list" id="rideList"></div>
        </section>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="ניווט ראשי">
      <button class="nav-item" id="navHome">
        <span class="nav-item__icon" aria-hidden="true">🏠</span>
        <span class="nav-item__label">בית</span>
      </button>
      <button class="nav-item is-active" id="navFindRide" aria-current="page">
        <span class="nav-item__icon" aria-hidden="true">🔍</span>
        <span class="nav-item__label">חיפוש נסיעה</span>
      </button>
      <button class="nav-item" id="navMyRides">
        <span class="nav-item__icon" aria-hidden="true">🚗</span>
        <span class="nav-item__label">הנסיעות שלי</span>
      </button>
      <button class="nav-item" id="navPreferences">
        <span class="nav-item__icon" aria-hidden="true">⚙️</span>
        <span class="nav-item__label">העדפות</span>
      </button>
    </nav>

    <!-- Ride details modal -->
    <div class="modal-overlay" id="rideModalOverlay" hidden>
      <div
        class="modal-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle">
        <div class="modal-sheet__handle" aria-hidden="true"></div>
        <div class="modal-sheet__header">
          <h2 id="modalTitle">פרטי הסעה</h2>
        </div>

        <div class="modal-info-box">
          <div class="modal-info-box__top">
            <div class="modal-info-box__field">
              <span class="modal-info-box__label">שעה</span>
              <span class="modal-info-box__time" id="modalTime"></span>
              <span class="modal-info-box__afternoon-label"
                id="modalAfternoonLabel" hidden></span>
            </div>
            <div class="modal-info-box__field modal-info-box__field--date">
              <span class="modal-info-box__label">תאריך</span>
              <span class="modal-info-box__date" id="modalDate"></span>
            </div>
          </div>
          <div class="modal-route">
            <div class="modal-route__point">
              <span class="modal-route__dot modal-route__dot--origin"></span>
              <span>מוצא: <strong id="modalOrigin"></strong></span>
            </div>
            <div class="modal-route__line"></div>
            <div class="modal-route__point">
              <span class="modal-route__dot modal-route__dot--dest"></span>
              <span>יעד: <strong id="modalDest"></strong></span>
            </div>
          </div>
        </div>

        <div class="modal-meta">
          <div class="modal-meta__row">
            <span class="modal-meta__label">נוסע</span>
            <span class="modal-meta__value">
              <span aria-hidden="true">👤</span>
              <span id="modalPatient"></span>
            </span>
          </div>
          <div class="modal-meta__divider"></div>
          <div class="modal-meta__row" id="modalEscortsRow" hidden>
            <span class="modal-meta__label">מלווים</span>
            <span class="modal-meta__value">
              <span aria-hidden="true">🧑‍🤝‍🧑</span>
              <span id="modalEscorts"></span>
            </span>
          </div>
          <div class="modal-meta__divider" id="modalEscortsDivider"
            hidden></div>
          <div class="modal-meta__row">
            <span class="modal-meta__label">אזור</span>
            <span class="modal-meta__value">
              <span aria-hidden="true">📍</span>
              <span id="modalArea"></span>
            </span>
          </div>
          <div class="modal-meta__divider" id="modalEquipmentDivider"
            hidden></div>
          <div class="modal-meta__row modal-meta__row--equipment"
            id="modalEquipmentRow" hidden>
            <span class="modal-meta__label">ציוד רפואי נדרש</span>
            <div class="equipment-chips" id="modalEquipmentChips"></div>
          </div>
          <div class="modal-meta__divider" id="modalPhoneDivider" hidden></div>
          <div class="modal-meta__row" id="modalPhoneRow" hidden>
            <span class="modal-meta__label">טלפון ליצירת קשר</span>
            <span class="modal-meta__value modal-meta__value--phone">
              <span id="modalPhone"></span>
              <a class="modal-call-btn" id="modalCallBtn"
                aria-label="התקשרות">📞</a>
            </span>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn-secondary" id="modalCloseBtn">סגור</button>
          <button class="btn-primary" id="modalRegisterBtn">הירשם
            לנסיעה</button>
        </div>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="../js/find-ride.js"></script>
  </body>
</html>
