<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#005f85" />
    <title>כניסה — Road to Recovery</title>
    <link rel="stylesheet" href="css/master.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <main class="page">
      <div class="login-card" role="main">
        <!-- Logo -->
        <div class="logo-wrap">
          <img
            src="../../../../Media/R2R Logo.png"
            alt="Road to Recovery"
            class="logo"
          />
        </div>

        <div class="card-divider"></div>

        <!-- Welcome -->
        <div class="welcome-wrap">
          <h1 class="heading">ברוכים הבאים</h1>
          <p class="subtitle">הזינו את מספר הטלפון הנייד שלכם לכניסה</p>
        </div>

        <!-- Form -->
        <form id="loginForm" class="login-form" novalidate>
          <div class="field">
            <label for="phone" class="label">מספר טלפון נייד</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              class="input input--phone"
              placeholder="0500000000"
              autocomplete="tel"
              inputmode="numeric"
              maxlength="15"
              aria-describedby="phone-hint"
              aria-label="מספר טלפון נייד"
            />
            <span id="phone-hint" class="hint hint--center"
              >לדוגמה: 0501234567</span
            >
          </div>

          <button
            type="submit"
            class="btn-primary btn-primary--login"
            id="loginBtn"
          >
            <span class="btn-text">כניסה</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
        </form>
      </div>
    </main>

    <!-- Toast container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="../js/login.js"></script>
  </body>
</html>
